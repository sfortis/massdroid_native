name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  RELEASE_APK:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: 'gradle'

      - name: Run Detekt
        run: ./gradlew detekt --stacktrace

      # Same gate build.yml applies to every push on dev. It is repeated here so a
      # tag on a commit that never went through dev, such as a hotfix branched
      # straight off main, cannot be published without the tests having run.
      - name: Run unit tests
        run: ./gradlew :core:testDebugUnitTest -PmassdroidBuildRoot=${{ github.workspace }}/build-output --stacktrace

      - name: Decode keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > ${{ github.workspace }}/release.jks

      - name: Build release APKs (both flavors)
        # github flavor = primary asset for users side-loading from GitHub (keeps
        # the in-app updater). fdroid flavor = reproducibility target for F-Droid;
        # the Binaries URL in fdroiddata points at the fdroid-flavored APK. The phone
        # app and the TV app both have the two flavors.
        run: ./gradlew app:assembleGithubRelease app:assembleFdroidRelease atv:assembleGithubRelease atv:assembleFdroidRelease -PmassdroidBuildRoot=${{ github.workspace }}/build-output --stacktrace
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Stage APKs for release
        run: |
          GH_APK=$(find build-output/app/outputs/apk/github/release -name "*.apk" | head -1)
          FD_APK=$(find build-output/app/outputs/apk/fdroid/release -name "*.apk" | head -1)
          TV_APK=$(find build-output/atv/outputs/apk/github/release -name "*.apk" | head -1)
          TV_FD_APK=$(find build-output/atv/outputs/apk/fdroid/release -name "*.apk" | head -1)
          mv "$GH_APK" "build-output/massdroid-${{ steps.version.outputs.version }}.apk"
          # The phone APK must sort first: GitHub lists release assets by name, and the
          # in-app updater of v2.38.1 and older installs the first .apk it finds. With the
          # F-Droid build named massdroid-fdroid-vX.apk, it sorted first and phones updated
          # into the F-Droid build, which has no updater.
          mv "$FD_APK" "build-output/massdroid-${{ steps.version.outputs.version }}_fdroid.apk"
          mv "$TV_APK" "build-output/massdroid-${{ steps.version.outputs.version }}_tv.apk"
          mv "$TV_FD_APK" "build-output/massdroid-${{ steps.version.outputs.version }}_tv_fdroid.apk"

      - name: Create GitHub Release
        run: |
          gh release create ${{ steps.version.outputs.version }} \
            "build-output/massdroid-${{ steps.version.outputs.version }}.apk" \
            "build-output/massdroid-${{ steps.version.outputs.version }}_fdroid.apk" \
            "build-output/massdroid-${{ steps.version.outputs.version }}_tv.apk" \
            "build-output/massdroid-${{ steps.version.outputs.version }}_tv_fdroid.apk" \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file WHATSNEW.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keep dev-latest in sync with the freshly cut release. A hotfix that
      # lands on main without a subsequent dev push would otherwise leave the
      # debug channel reporting an older versionName than stable. We rebuild
      # the same checkout in debug mode and push it to dev-latest so users
      # tracking the debug release always see a version that is >= the
      # latest tag on main.
      - name: Setup debug keystore for dev-latest build
        run: |
          mkdir -p $HOME/.android
          cp ./.ci/debug.keystore $HOME/.android/debug.keystore

      - name: Build debug APK for dev-latest
        # github flavor for the debug/dev channel (keeps the in-app updater).
        run: ./gradlew app:assembleGithubDebug -PmassdroidBuildRoot=${{ github.workspace }}/build-output --stacktrace

      - name: Refresh dev-latest with matching debug APK
        run: |
          gh release create dev-latest --target dev --title "Dev Build (latest)" --notes "Automatically updated debug APK from the latest dev push." --prerelease 2>/dev/null || true
          gh release upload dev-latest build-output/app/outputs/apk/github/debug/*.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Google Play: phone, Android TV and Android Automotive OS share one listing, each on its own
  # form factor track. A separate job, so a Play problem never holds back the GitHub release or
  # the F-Droid APKs. The bundles are always kept as a workflow artifact, because Play accepts the
  # first bundle of a new app only through the Console. The upload runs only when the service
  # account secret exists.
  PLAY_AABS:
    name: Google Play bundles
    runs-on: ubuntu-latest
    env:
      # The closed test, so every release reaches the testers group once Google has reviewed it.
      # The phone's closed track is "alpha"; the TV and AAOS closed tracks are named "closed".
      PLAY_PHONE_TRACK: alpha
      PLAY_FORM_FACTOR_TRACK: closed
      PLAY_STATUS: completed
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: 'gradle'

      - name: Decode keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > ${{ github.workspace }}/release.jks

      - name: Build release bundles
        # play = the phone, automotive = AAOS (versionCode 1_000_000 + N), atv play = the TV
        # under the phone's package (versionCode 2_000_000 + N).
        run: ./gradlew app:bundlePlayRelease app:bundleAutomotiveRelease atv:bundlePlayRelease -PmassdroidBuildRoot=${{ github.workspace }}/build-output --stacktrace
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Stage bundles and release notes
        id: stage
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p build-output/play
          mv "$(find build-output/app/outputs/bundle/playRelease -name '*.aab' | head -1)" "build-output/play/massdroid-${VERSION}_play.aab"
          mv "$(find build-output/app/outputs/bundle/automotiveRelease -name '*.aab' | head -1)" "build-output/play/massdroid-${VERSION}_automotive.aab"
          mv "$(find build-output/atv/outputs/bundle/playRelease -name '*.aab' | head -1)" "build-output/play/massdroid-${VERSION}_tv_play.aab"
          ls -la build-output/play
          # Play does not read the native debug symbols inside the bundle, so each upload carries
          # them separately, taken from the bundle's metadata.
          for name in play automotive tv_play; do
            unzip -q "build-output/play/massdroid-${VERSION}_${name}.aab" 'BUNDLE-METADATA/com.android.tools.build.debugsymbols/*' -d "build-output/symbols-${name}"
          done
          # The F-Droid changelog of this version doubles as the Play "What's new" text.
          CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*=\s*([0-9]+).*/\1/')
          NOTES="app/fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          if [ -f "$NOTES" ]; then
            mkdir -p build-output/whatsnew
            cp "$NOTES" build-output/whatsnew/whatsnew-en-US
            echo "whatsnew=build-output/whatsnew" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Keep bundles as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: massdroid-${{ steps.stage.outputs.version }}-play-bundles
          path: build-output/play/*.aab

      - name: Upload phone bundle to Google Play
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: net.asksakis.massdroidv2
          releaseFiles: build-output/play/massdroid-${{ steps.stage.outputs.version }}_play.aab
          mappingFile: build-output/app/outputs/mapping/playRelease/mapping.txt
          debugSymbols: build-output/symbols-play/BUNDLE-METADATA/com.android.tools.build.debugsymbols
          track: ${{ env.PLAY_PHONE_TRACK }}
          status: ${{ env.PLAY_STATUS }}
          releaseName: ${{ steps.stage.outputs.version }}
          whatsNewDirectory: ${{ steps.stage.outputs.whatsnew }}

      - name: Upload Android Automotive OS bundle to Google Play
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: net.asksakis.massdroidv2
          releaseFiles: build-output/play/massdroid-${{ steps.stage.outputs.version }}_automotive.aab
          mappingFile: build-output/app/outputs/mapping/automotiveRelease/mapping.txt
          debugSymbols: build-output/symbols-automotive/BUNDLE-METADATA/com.android.tools.build.debugsymbols
          track: automotive:${{ env.PLAY_FORM_FACTOR_TRACK }}
          status: ${{ env.PLAY_STATUS }}
          releaseName: ${{ steps.stage.outputs.version }}
          whatsNewDirectory: ${{ steps.stage.outputs.whatsnew }}

      - name: Upload Android TV bundle to Google Play
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: net.asksakis.massdroidv2
          releaseFiles: build-output/play/massdroid-${{ steps.stage.outputs.version }}_tv_play.aab
          mappingFile: build-output/atv/outputs/mapping/playRelease/mapping.txt
          debugSymbols: build-output/symbols-tv_play/BUNDLE-METADATA/com.android.tools.build.debugsymbols
          track: tv:${{ env.PLAY_FORM_FACTOR_TRACK }}
          status: ${{ env.PLAY_STATUS }}
          releaseName: ${{ steps.stage.outputs.version }}
          whatsNewDirectory: ${{ steps.stage.outputs.whatsnew }}
