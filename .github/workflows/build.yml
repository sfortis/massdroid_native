name: Build
on:
  push:
    branches:
      - dev
    paths-ignore:
      - '*.md'
      - 'screenshots/**'
      - 'internal_docs/**'
      - 'LICENSE'
  pull_request:
permissions:
  contents: write

jobs:
  ANDROID_BUILD_APK:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: 'gradle'

      - name: Run Detekt
        run: ./gradlew detekt --stacktrace

      - name: Run unit tests
        run: ./gradlew :core:testDebugUnitTest -PmassdroidBuildRoot=${{ github.workspace }}/build-output --stacktrace

      # results in all CICD builds being signed with the same debug key, to ease installation and testing of the generated APKs
      # this is not a security issue, as the debug key is not used for release builds and the generated APKs are not intended for distribution
      - name: Setup custom keystore file
        run: |
          mkdir -p $HOME/.android
          cp ./.ci/debug.keystore $HOME/.android/debug.keystore

      - name: Execute APK build
        # app has github/fdroid flavors; the dev channel ships the github flavor
        # (keeps the in-app updater). atv has no flavors.
        run: ./gradlew app:assembleGithubDebug atv:assembleDebug -PmassdroidBuildRoot=${{ github.workspace }}/build-output --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: apk-files
          path: |
            build-output/app/outputs/apk/**/*.apk
            build-output/atv/outputs/apk/**/*.apk

      - name: Upload dev APKs to dev-latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        # The APK filename carries the version, so every push used to ADD assets
        # rather than replace them: dev-latest had accumulated 33 APKs, about a
        # gigabyte, going back to March, and the newest was not obvious to anyone
        # opening the page. Anything that is not one of the two APKs just
        # uploaded is now pruned. This also keeps AppUpdateChecker
        # honest: it picks the FIRST asset whose name ends in .apk, so a pile of
        # historic builds is a stale-APK trap if the beta channel ever starts
        # resolving this release (today its "dev-latest" tag fails to parse as a
        # version, so it does not get that far).
        run: |
          set -euo pipefail
          gh release create dev-latest --target dev --title "Dev Build (latest)" --notes "Automatically updated debug APKs (phone + Android TV) from the latest dev push." --prerelease 2>/dev/null || true
          phone=$(ls build-output/app/outputs/apk/github/debug/*.apk)
          tv=$(ls build-output/atv/outputs/apk/debug/*.apk)
          # Upload BEFORE pruning, so the release is never briefly empty for
          # anyone downloading while this runs.
          gh release upload dev-latest "$phone" "$tv" --clobber
          keep=" $(basename "$phone") $(basename "$tv") "
          for asset in $(gh release view dev-latest --json assets --jq '.assets[].name'); do
            case "$keep" in
              *" $asset "*) continue ;;
            esac
            echo "Deleting stale asset $asset"
            gh release delete-asset dev-latest "$asset" --yes
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

