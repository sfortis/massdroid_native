build:
  maxIssues: 0

style:
  WildcardImport:
    active: false
  # An import left behind after a rewrite compiles and says nothing, so it is the
  # kind of thing only a rule catches. Turned on after one survived a backdrop
  # rewrite in NowPlayingScreen and was found by eye instead.
  UnusedImports:
    active: true
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140

complexity:
  LongMethod:
    threshold: 80
  ComplexMethod:
    threshold: 20
  TooManyFunctions:
    active: false
  LargeClass:
    threshold: 600

naming:
  FunctionNaming:
    # Compose functions are PascalCase
    ignoreAnnotated: ['Composable']
